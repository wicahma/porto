clone:
  git:
    image: bash
    settings:
      lfs: false

labels:
  backend: local

steps:
  - name: build
    image: bash
    commands:
      - NODE_BIN="$(ls -d /home/diama/.nvm/versions/node/*/bin 2>/dev/null | sort -V | tail -1)"
      - export PATH="/home/diama/ci-tools/bin:$NODE_BIN:/home/diama/.local/bin:/usr/local/bin:$PATH"
      - export NODE_OPTIONS="--max-old-space-size=1536"
      - set -a; . /home/diama/repos/personal-porto/porto/.env.local; set +a
      - npm install --legacy-peer-deps
      - npm run build

  - name: deploy-homelab
    image: bash
    commands:
      - NODE_BIN="$(ls -d /home/diama/.nvm/versions/node/*/bin 2>/dev/null | sort -V | tail -1)"
      - export PATH="/home/diama/ci-tools/bin:$NODE_BIN:/home/diama/.local/bin:/usr/local/bin:$PATH"
      - WS="${CI_WORKSPACE:-$PWD}"
      - chmod a+x "$WS" "$(dirname "$WS")"
      - chmod -R a+rX "$WS/.next" "$WS/public"
      - /usr/bin/sudo -n -u diama /home/diama/bin/porto-ci-deploy "$WS"

  - name: verify
    image: bash
    commands:
      - sleep 5
      - curl -fsS -o /dev/null -w 'local=%{http_code}\n' --user-agent 'Mozilla/5.0' http://127.0.0.1:3001/
      - curl -fsS -o /dev/null -w 'public=%{http_code}\n' --user-agent 'Mozilla/5.0' https://diama.dev/

when:
  - event: [push, manual]
    branch: [production]
