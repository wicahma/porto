clone:
  git:
    image: bash
    settings:
      lfs: false

labels:
  backend: local

steps:
  - name: build
    image: bash
    commands:
      - export PATH="/home/diama/ci-tools/bin:/home/diama/.nvm/versions/node/v24.16.0/bin:/home/diama/.local/bin:$PATH"
      - export NODE_OPTIONS="--max-old-space-size=1536"
      - set -a; . /home/diama/repos/personal-porto/porto/.env.local; set +a
      - npm install --legacy-peer-deps
      - npm run build

  - name: deploy-homelab
    image: bash
    commands:
      - export PATH="/home/diama/ci-tools/bin:/home/diama/.nvm/versions/node/v24.16.0/bin:/home/diama/.local/bin:$PATH"
      - rm -rf /tmp/porto-stage && mkdir -p /tmp/porto-stage
      - cp -r .next /tmp/porto-stage/.next
      - cp -r public /tmp/porto-stage/public
      - chmod -R a+rX /tmp/porto-stage
      - /usr/bin/sudo -n -u diama /home/diama/bin/porto-ci-deploy /tmp/porto-stage

  - name: verify
    image: bash
    commands:
      - sleep 5
      - curl -fsS -o /dev/null -w 'http=%{http_code}\n' --user-agent 'Mozilla/5.0' http://127.0.0.1:3001/

when:
  - event: [push, manual]
    branch: [main-v2]
